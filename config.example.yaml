# SERO Accounting Agent — Beispielkonfiguration
# Kopiere diese Datei nach `config.yaml` und passe die Werte an.
# `config.yaml` ist in .gitignore (enthaelt Mandanten-/Steuerparameter).

unternehmen:
  name: "SERO Handel (Einzelunternehmen)"
  finanzamt: "Muenchen"
  bundesland: "Bayern"
  rechtsform: "einzelunternehmen"       # einzelunternehmen | personengesellschaft
  gewinnermittlung: "euer"               # euer (Ist-Prinzip) | bilanz
  geschaeftsbeginn: "2026-06-01"         # Verkaeufe/Konto ab hier zaehlen als Geschaeft
  einkauf_ab: "2026-03-01"               # Einkaufspreise schon ab hier (§25a-Ware aus Einlage)

steuer:
  # Kleinunternehmer nach § 19 UStG. Bei false: Regelbesteuerung (Vorsteuerabzug,
  # bindet 5 Jahre). Der Agent warnt aktiv vor Ueberschreiten der Schwellen.
  kleinunternehmer: true
  ust_id: ""                             # USt-IdNr (BZSt) — fuer eBay-EU-Verkaeufe Pflicht
  oss_registriert: false                 # One-Stop-Shop beim BZSt aktiv?
  ustva_rhythmus: "quartal"              # monat | quartal | jahr
  dauerfristverlaengerung: false

schwellen:
  # Frühwarnung loest REVIEW_REQUIRED aus, sobald `warnung_ab_prozent` erreicht ist.
  kleinunternehmer_vorjahr_eur: 25000    # § 19 UStG, Vorjahr (netto)
  kleinunternehmer_laufend_eur: 100000   # § 19 UStG, laufendes Jahr (harte Grenze)
  oss_fernverkauf_eur: 10000             # EU-weite Lieferschwelle (§25a-Ware ausgenommen)
  gewerbesteuer_freibetrag_eur: 24500    # Gewinn-Freibetrag Einzelunternehmer
  warnung_ab_prozent: 80

review:
  # Buchungen oberhalb dieser Bruttoschwelle gehen immer in die Review-Queue.
  betragsschwelle_eur: 2000

aufbewahrung:
  # Sicherheitsregel: im Zweifel 10 Jahre. Belege/Rechnungen = 8 Jahre.
  buchungsbelege_jahre: 8
  buecher_jahresabschluss_jahre: 10
  geschaeftsbriefe_jahre: 6

pfade:
  audit_log: "audit/audit_log.jsonl"     # append-only, hash-verkettet
  belegspeicher: "belege/"               # WORM / versioniert
  verfahrensdoku: "docs/verfahrensdokumentation.md"
  ebay_export: "data/ebay_rows.json"     # eBay-Verkaufszeilen (von ebay-sync befuellt)
  ebay_payouts: "data/ebay_payouts.json" # eBay-Auszahlungen (von ebay-sync befuellt)
  ebay_kaeufe_export: "data/ebay_kaeufe.json"  # eBay-Kaufhistorie (Bestellverlauf-Export)
  ebay_fees_export: "data/ebay_fees.json"      # echte eBay-Gebuehren (von ebay-finances)
  ebay_signing_key: "data/ebay_signing_key.json"  # Ed25519-Signaturschluessel (gitignored!)
  einkaufspreise: "data/einkaufspreise.json"  # {product_id: preis} fuer § 25a
  belege_inbox: "inbox/belege/"          # autonomer Betrieb: Belege hier ablegen
  bank_csv: "inbox/kontoumsaetze.csv"    # autonomer Betrieb: Lexware-Konto-CSV
  ausgaben_csv: "inbox/ausgaben.csv"     # echte Rechnungen (datum;kategorie;betrag;text)
  review_store: "data/review_queue.json" # geteilte Review-Queue (Pipeline <-> Bot)
  status: "data/status.json"             # Dashboard-Snapshot (Bot /report, /schwellen)
  notify_state: "data/notified.json"     # Zustand fuer proaktive Meldungen (Anti-Doppel)
  telegram_owner: "data/telegram_owner.json"  # erster Schreiber wird hier als Eigentuemer gemerkt

costs:
  ebay_fee_percent: 0.13                 # eBay-Verkaufsgebuehr (Schaetzung, ~13 %)
  ebay_fixed_per_order: 0.35             # fixe Gebuehr je Verkauf (EUR)

# --- Rechnungsstellung (Billbee-Ersatz) ---
# Erzeugt aus eBay-Verkaeufen rechtskonforme Rechnungen, archiviert sie (GoBD,
# unter belege/ = gitignored, da Kundendaten) und uebertraegt sie nach Lexware.
rechnung:
  aktiv: true
  modus: "alle"                          # alle | intern | manuell
  nummer_prefix: ""                      # z. B. "RE-"  -> RE-2026-0001
  nummer_mit_jahr: true                  # 2026-0001 (false: durchgehend ab nummer_start)
  nummer_start: 1
  kleinunternehmer_hinweis: "Gemäß § 19 UStG wird keine Umsatzsteuer berechnet (Kleinunternehmer)."
  verzeichnis: "belege/rechnungen/"      # Ablage HTML/Text/JSON/PDF (gitignored)
  register: "data/rechnungen_register.json"     # idempotent: 1 Rechnung je Bestellung
  nummernkreis: "data/rechnungsnummern.json"    # fortlaufender Zaehler (§14 UStG)
  lexware:
    push: false                          # true: run-all pusht automatisch; sonst `rechnungen-push`
    finalize: false                      # true = sofort festschreiben (GoBD-fest, nicht aenderbar)
    pdf_speichern: true                  # gerenderte Lexware-PDF lokal sichern
  absender:                              # PFLICHT fuer Rechtsgueltigkeit (§14 UStG)
    name: ""                             # Firmen-/Inhabername
    strasse: ""
    plz: ""
    ort: ""
    land: "DE"
    steuernummer: ""                     # Steuernummer ODER ust_id Pflicht
    ust_id: ""
    email: ""
    telefon: ""
    iban: ""
    bic: ""

betrieb:
  pipeline_intervall_stunden: 6          # `serve`: Pipeline-Takt
  ebay_sync_tage: 30                     # Zeitfenster fuer ebay-sync

# --- Integrationen ---
# WICHTIG: echte Keys NUR in config.yaml (gitignored) eintragen, nie hier.
integrationen:
  lexware_office:
    base_url: "https://api.lexoffice.io/v1"
    api_key: ""                          # laeuft ab -> erneuern
    rate_limit_rps: 2                    # HTTP 429 -> Backoff/Queue
    finalize_belege: false               # API legt default Drafts an (Festschreibung = manuell)
    kategorie_map:                       # interne Kategorie -> Lexware-Kategorie-UUID
      wareneinkauf: ""
      buero: ""
      software: ""
      versand: ""
      werbung: ""
      gebuehren: ""
  ebay:
    konto_typ: "gewerblich"              # gewerblich | privat
    environment: "production"            # production | sandbox
    app_id: ""                           # Client ID (Production, gewerblich)
    dev_id: ""
    cert_id: ""                          # Client Secret
    ru_name: ""                          # RuName (Redirect-URL-Name) aus Developer Portal
    marketplace_id: "EBAY_DE"
    refresh_token: ""                    # dauerhaft (~18 Monate); via `ebay-token <code>`
    access_token: ""                     # optional: kurzlebiger User-Token (~2h) als Fallback
    default_tax_scheme: "differenz"      # Verkaeufe per Default § 25a (Sammelware); sonst "regel"
  bank:
    provider: "lexware_csv"              # Lexware Office = Geschaeftskonto -> CSV-Export
    csv_mapping: {}                      # optional: {date: "...", amount: "...", text: "..."}
  ocr: { provider: "textract", region: "eu-central-1" }
  llm:
    provider: "anthropic"                # Klassifikation/Orchestrierung
    model: "claude-opus-4-8"
    api_key: ""

interface:
  telegram:
    token: ""                            # BotFather-Token
    allowed_user_ids: []                 # nur diese User duerfen Freigaben erteilen
    poll_timeout: 30
